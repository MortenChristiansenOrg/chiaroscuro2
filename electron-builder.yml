# Shared settings; channel identity is supplied by scripts/release-config.ts.
beforePack: scripts/check-package.cjs
directories:
  buildResources: resources
  output: dist

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - resources/**/*
  - "!**/*.map"

# Windows-only — no macOS or Linux targets
win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# resources/installer.nsh registers namespaced browser capabilities and Open With
# candidates without overwriting the user's chosen file/protocol defaults.
# electron-builder fileAssociations would use shared class names and set defaults.

# Publisher and update channel are supplied with the release identity.

# electron-updater reads this to find the release
electronUpdaterCompatibility: ">= 2.16"
