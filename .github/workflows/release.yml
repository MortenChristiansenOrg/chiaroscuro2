name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag: v1.2.3 (stable) or v1.2.3-beta.1 (Early Access)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Validate release tag and channel
        id: release
        run: bun scripts/release-tag.ts
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  build:
    name: Build Windows Installer
    needs: [verify]
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build installer
        shell: bash
        run: bun run package:win "$RELEASE_TAG"
      - name: Verify installer assets
        shell: bash
        run: |
          ls dist/*/*.exe dist/*/*.yml dist/*/*.blockmap || { echo "::error::Missing installer, updater manifest, or blockmap"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*/*.exe
            dist/*/*.yml
            dist/*/*.blockmap
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [verify, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.yml
            dist/**/*.blockmap
